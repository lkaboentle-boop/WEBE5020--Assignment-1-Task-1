 <html lang="en">

<body>

    <headera>
        <div class="Logo"> 
            <img src="_images/_logo.jpg" height="150" weight="100" alt="Sweet Creations By Soso Logo">
            <h1> Sweet Creations By Soso</h1>
        </div>

        <nav>
            <a href="index.html"> Home</a> |

            <a href="enquiry.html"> Enquiry</a> |
            <a href="contact.html"> Contact </a>
        </nav>
    </headera>

    <main>

        <section class="enquiry">
            <h2>Place an Enquiry | Order </h2>

            <form action="#" method="post">

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your Full Name" required><br><br>

                <label for="email"> Email Address:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your Email Address" required><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" required><br><br>

                <label for="products"> Select Product:</label><br>
                <select id="product" name="product" required>
                    <option value=""> Choose a product</option>
                    <option value="Jam-tart">Apricot Jam Tart </option>
                    <option value="Jam-tart"> Raspberry Jam Tart</option>
                    <option value="Rainbow-biscuits"> Rainbow Biscuit</option>
                    <option value="Strippy-biscuit">Strippy Biscuit</option>
                    <option value="Heart-biscuit">Heart Biscuit</option>
                    <option value="LongLay-biscuit"> LongLay Biscuit</option>
                </select>

                <label for="quantity"> Quantity:</label><br>
                <nput type="number" id="quantity" name="quantity" min="1" placeholder="Enter quantity" required></nput><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" placeholder="Enter your enquiry or order details"></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>

    </footer>
